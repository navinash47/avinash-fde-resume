name: Assemble PDF
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble PDF from chunks
        run: |
          cat pdf-chunk-*.b64 | base64 -d > Avinash_Nandyala_FDE.pdf
          SIZE=$(stat -c%s Avinash_Nandyala_FDE.pdf)
          echo "Assembled PDF size: $SIZE bytes"
          test "$SIZE" -gt 20000
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: assemble Avinash_Nandyala_FDE.pdf from chunks"
          file_pattern: Avinash_Nandyala_FDE.pdf
